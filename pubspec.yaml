name: vervestride
description: AI-powered personal assistant platform with fitness, wellness, smart reminders, and creative AI tools
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  openfoodfacts: ^3.2.0

  wakelock_plus: ^1.2.8

  # Firebase
  firebase_core: ^4.3.0
  firebase_ai: ^3.8.0
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.1.3
  firebase_messaging: ^16.1.0
  firebase_crashlytics: ^5.0.6
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6

  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  google_sign_in: ^6.2.1
  google_fonts: ^6.3.3

  # ML / Media
  tflite_flutter: ^0.12.1
  camera: ^0.10.6
  camera_web: ^0.3.5+3
  image_picker: ^1.0.7
  image: ^4.3.0
  video_player: ^2.8.6
  screenshot: ^3.0.0

  # Files & paths
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.1.2

  # Location
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.3
  device_info_plus: ^10.1.0

  # UI / Utils
  intl: ^0.20.2
  collection: ^1.18.0
  table_calendar: ^3.1.3
  fl_chart: ^0.66.0
  sensors_plus: ^5.0.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0

  # Local DB
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Data
  uuid: ^4.3.3
  csv: ^6.0.0
  excel: ^4.0.1

  # Markdown / AI chat rendering
  flutter_markdown: ^0.7.4
  flutter_highlight: ^0.7.0

  # Logging
  logger: ^2.0.2+1

  # Ads
  google_mobile_ads: ^5.2.0

  # Payment
  razorpay_flutter: ^1.3.7

dependency_overrides:
  camera_android: 0.10.9+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (REQUIRED)
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/movenet_lightning.tflite

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vervestridelogo.png"
  web:
    generate: true
    image_path: "assets/images/vervestridelogo.png"
  windows:
    generate: true
    image_path: "assets/images/vervestridelogo.png"
  macos:
    generate: true
    image_path: "assets/images/vervestridelogo.png"
  min_sdk_android: 21